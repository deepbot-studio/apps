<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="lib/deck.css"><link rel="stylesheet" href="lib/studio.css">
<style>
  body { height: auto; background: var(--card); }
  .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .tag { font: 600 10.5px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); }
  .ttl { font-weight: 700; font-size: 15px; }
  .note { padding: 8px 14px 0; color: var(--muted-foreground); font-size: 13px; }
  .main { position: relative; margin: 12px 14px 0; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 26px rgba(0,0,0,.12); cursor: pointer; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 18px; cursor: pointer; z-index: 3; }
  .nav.l { left: 8px; } .nav.r { right: 8px; }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px; }
  .mini { flex: none; width: 120px; border-radius: 5px; border: 2px solid transparent; cursor: pointer; overflow: hidden; }
  .mini.on { border-color: var(--foreground); }
  .ft { display: flex; justify-content: space-between; align-items: center; padding: 4px 14px 12px; gap: 8px; }
  .full .main { max-width: calc((100vh - 230px) * 16 / 9); margin-left: auto; margin-right: auto; }
</style></head>
<body><div id="root"><div class="note">Opening the deck…</div></div>
<script src="vendor/html-to-image.js"></script>
<script type="module" src="card.js"></script></body>
</html>
